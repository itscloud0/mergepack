name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install . --force-reinstall
      - name: Test
        run: python -m unittest discover -s tests
      - name: Compile
        run: python -m compileall src tests
      - name: CLI smoke
        run: mergepack --diff-file examples/sample-pr.diff --repo examples/mini-repo --output /tmp/MERGEPACK.md
      - name: JSON smoke
        run: |
          mergepack --diff-file examples/sample-pr.diff --repo examples/mini-repo --format json --output /tmp/mergepack.json
          python -m json.tool /tmp/mergepack.json
      - name: SARIF smoke
        run: |
          mergepack --diff-file examples/sample-pr.diff --repo examples/mini-repo --format sarif --output /tmp/mergepack.sarif
          python -m json.tool /tmp/mergepack.sarif

  public-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install released wheel without checkout
        run: >-
          python -m pip install --no-deps
          https://github.com/itscloud0/mergepack/releases/download/v0.7.1/mergepack-0.7.1-py3-none-any.whl
      - name: CLI smoke
        run: |
          python -c "import mergepack; assert mergepack.__version__ == '0.7.1'"
          mergepack --help
